name: Daily Data Crawler

on:
  schedule:
    # 表达式基于 UTC 时间：以下代表每天 UTC 02:00（即北京时间 10:00）运行
    - cron: '0 2 * * *'
  workflow_dispatch: # 保留手动触发按钮，方便随时测试

# 必须赋予写权限，否则 Actions 无法将更新后的 data.json 推送回仓库
permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 自动缓存依赖，提升运行速度

      - name: 3. 安装依赖包
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 安装 Playwright 浏览器
        run: |
          playwright install chromium --with-deps

      - name: 4. 执行爬虫脚本
        run: |
          python scripts/fetch_and_process.py

      - name: 5. 提交并推送更新后的 data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json history/
          
          # 检查是否有文件变更；若无变更则不提交，避免流水线报错
          if git diff --staged --quiet; then
            echo "数据未发生变化，无需提交。"
          else
            git commit -m "chore: 自动更新 data.json及历史归档数据 [skip ci]"
            git push
          fi
